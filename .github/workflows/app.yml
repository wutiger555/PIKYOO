# The Expo app (app/): its own install (React Native pins its React version), typechecked with packages/core.
name: app
on:
  pull_request:
    paths: ["app/**", "packages/core/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "packages/core/**"]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc --noEmit
